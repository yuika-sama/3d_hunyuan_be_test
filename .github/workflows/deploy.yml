name: Build, Test and Deploy to Runpod Serverless

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Unit and Mock Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-runpod.txt

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" safetensors pillow httpx runpod==2.3.0 pytest fastapi python-multipart

      - name: Build and test the native texture module
        working-directory: 3d_generative/Hunyuan3D-2-main/hy3dgen/texgen/differentiable_renderer
        run: |
          pip install pybind11
          python setup.py build_ext --inplace
          python -m pytest "$GITHUB_WORKSPACE/test_native_texture.py" -q

      - name: Run Pytest
        run: |
          python -m pytest test_handler.py test_gateway.py test_runpod_smoke.py -v

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Free 35+ GB of disk space on the GitHub runner
      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune --all --volumes --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags
        id: meta
        run: |
          LOWERCASE_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_TAG="${LOWERCASE_IMAGE}:sha-${{ github.sha }}"
          LATEST_TAG="${LOWERCASE_IMAGE}:latest"
          echo "image_tag=${COMMIT_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${COMMIT_TAG}" >> "$GITHUB_ENV"
          echo "tag_latest=${LATEST_TAG}" >> "$GITHUB_ENV"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.tag_commit }}
            ${{ env.tag_latest }}
          cache-from: type=registry,ref=${{ env.tag_latest }}
          cache-to: type=inline

  deploy-runpod:
    name: Update Runpod & Analysis Smoke Test
    timeout-minutes: 40
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install httpx
      - name: Deploy to Runpod Serverless
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID }}
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_ENDPOINT_ID" ]; then
            echo "::warning ::Set RUNPOD_API_KEY and RUNPOD_ENDPOINT_ID to deploy. Image pushed to GHCR: $NEW_IMAGE."
            exit 0
          fi

          HTTP_CODE=$(curl --connect-timeout 10 --max-time 60 --silent --show-error \
            --output /dev/null --write-out "%{http_code}" \
            -X PATCH "https://api.runpod.io/v2/serverless/$RUNPOD_ENDPOINT_ID" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"$NEW_IMAGE\"}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error ::Runpod endpoint update failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Endpoint image updated to $NEW_IMAGE."
          python runpod_smoke.py 3d_generative/Hunyuan3D-2-main/assets/example_images/004.png --action analyze
